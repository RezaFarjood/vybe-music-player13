name: vybe
description: VYBE - A beautiful local music player for Windows and Android.
publish_to: none
version: 0.5.0+10

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  audio_service: 0.18.19
  audio_session: 0.2.4
  file_picker: 12.1.3
  shared_preferences: 2.5.3
  audio_metadata_reader: 1.8.0
  webview_flutter: 4.14.1
  url_launcher: 6.3.2
  path_provider: 2.1.5
  crypto: 3.0.6
  google_fonts: 6.3.3
  window_manager: 0.5.2
  webview_flutter_windows: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/vybe_icon_1024.png
    - assets/brand/vybe_wordmark.png
